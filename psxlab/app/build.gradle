plugins { id 'com.android.application' }
android {
    namespace 'dev.psxlab'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.psxlab'; minSdk 26; targetSdk 35
        versionCode 59
        versionName '0.13.8-disc-formats'
        manifestPlaceholders = [cpuProfileable: project.hasProperty('cpuDiagnosis') ? 'true' : 'false']
        testInstrumentationRunner 'dev.psxlab.BootInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    ndkVersion '28.2.13676358'
    testBuildType project.hasProperty('optimized') ? 'release' : 'debug'
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
