name: Android original engine checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psxlab-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check out legacy frontend Java dependency
        run: git submodule update --init --depth 1 third_party/SDL
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-35
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1
            ndk;28.2.13676358
            ndk;29.0.14206865
      - name: Core regressions
        working-directory: psxlab
        run: ./gradlew --no-daemon -Poptimized=true testReleaseUnitTest
      - name: Compose integration and development APK
        working-directory: android
        run: >-
          ./gradlew --no-daemon -PpsxlabRuntimeTest
          -Parmsx.applicationId=com.nanodata.armsx.psxlabci
          :app:assembleGithubDebug :app:testGithubDebugUnitTest
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: original-engine-development-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/github/debug/*.apk
            android/app/build/reports/tests/
            psxlab/app/build/reports/tests/
          if-no-files-found: warn
